name: Release to Maven Central

# Publishes all Knowledge4j modules (com.aresstack:knowledge4j-*) to Maven Central and creates the tag v<version> with
# a GitHub release on the chosen main commit. Only manually: Actions › Release to Maven Central › Run workflow, enter
# the version (e.g. 0.1.0). Maven Central versions are final; a published version can never be replaced. Secrets of the
# organisation aresstack (GPG_PRIVATE_KEY, GPG_PASSPHRASE, CENTRAL_USERNAME, CENTRAL_PASSWORD) as for Research4j.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 0.1.0 (no SNAPSHOT)'
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: maven-central
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 160
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Verify version and commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version $VERSION is not <major>.<minor>.<patch>"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release only from main"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION exists already"; exit 1
          fi
          echo "Knowledge4j $VERSION from ${GITHUB_SHA:0:12}" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and verify libraries
        run: bash gradlew --no-daemon clean build -PreleaseVersion="$VERSION"
      - name: Sign release bundle
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" ] || { echo "::error::Secret GPG_PRIVATE_KEY missing (organisation aresstack, repository access for knowledge4j)"; exit 1; }
          bash gradlew --no-daemon zipAggregation -PreleaseVersion="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: central-bundle-${{ inputs.version }}
          path: build/nmcp/zip/aggregation.zip
          if-no-files-found: error
      - name: Publish signed bundle
        env:
          ORG_GRADLE_PROJECT_centralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_centralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          [ -n "$ORG_GRADLE_PROJECT_centralUsername" ] && [ -n "$ORG_GRADLE_PROJECT_centralPassword" ] \
            || { echo "::error::Secrets CENTRAL_USERNAME/CENTRAL_PASSWORD missing (organisation aresstack, repository access for knowledge4j)"; exit 1; }
          bash gradlew --no-daemon publishAggregationToCentralPortal -PreleaseVersion="$VERSION"
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --title "Knowledge4j $VERSION"
